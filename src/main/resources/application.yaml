spring:
  application:
    name: Biblioteca
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:25}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS_ENABLE:false}
          from: ${MAIL_FROM:noreply@biblioteca.com}
  datasource:
    url: ${DB_URL:jdbc:h2:mem:bibliotecadb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:true}
      path: /h2-console
  jpa:
    database-platform: ${JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true

jwt:
  # Clave secreta HMAC-SHA256 (mínimo 256 bits / 32 bytes)
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  # 15 minutos en milisegundos (15 * 60 * 1000)
  expiration: ${JWT_EXPIRATION:900000}
  # 7 días en milisegundos (7 * 24 * 60 * 60 * 1000)
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

server:
  port: ${SERVER_PORT:8081}

google:
  books:
    api:
      key: ${GOOGLE_BOOKS_API_KEY:}
      base-url: ${GOOGLE_BOOKS_BASE_URL:https://www.googleapis.com/books/v1}

app:
  scheduler:
    loan-reminder:
      cron: ${LOAN_REMINDER_CRON:0 0 8 * * *}
